<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whispr — Chat</title>
    <link rel="stylesheet" href="interface.css" />

    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>

<body>

    <div class="chat-shell">

        <!-- ============ LEFT: Chat list ============ -->
        <aside class="chat-sidebar">

            <div class="me-row">
                <!-- TODO: bind from GET /api/me -->
                <div class="me-avatar">
                    <span class="avatar-ph"></span>
                    <span class="status-dot online"></span>
                </div>
                <div class="me-info">
                    <p class="me-name skeleton-text skeleton-name"></p>
                    <p class="me-sub"><i class="fa-solid fa-shield-halved"></i> Protecting conversations</p>
                </div>
                <button class="icon-btn-flat" aria-label="Notifications"><i class="fa-solid fa-bell"></i></button>
                <button class="icon-btn-flat" aria-label="More"><i class="fa-solid fa-ellipsis"></i></button>
            </div>

            <div class="sidebar-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search chats…">
                <kbd>⌘K</kbd>
                <button class="new-chat-btn" aria-label="New chat"><i class="fa-solid fa-plus"></i></button>
            </div>

            <div class="chat-tabs">
                <a href="#" class="chat-tab active">Active Now</a>
                <a href="#" class="chat-tab">Favourite</a>
                <a href="#" class="chat-tab">All</a>
            </div>

            <!-- TODO: bind list from GET /api/chats?filter=active&search= -->
            <div class="chat-list">

                <a href="#" class="chat-item active">
                    <div class="chat-item-avatar">
                        <span class="avatar-ph"></span>
                        <span class="status-dot online"></span>
                    </div>
                    <div class="chat-item-body">
                        <div class="chat-item-top">
                            <span class="skeleton-text skeleton-name"></span>
                            <span class="skeleton-text skeleton-time"></span>
                        </div>
                        <div class="chat-item-bottom">
                            <span class="skeleton-text skeleton-preview"></span>
                            <span class="unread-badge skeleton-badge-sm"></span>
                        </div>
                    </div>
                </a>

                <a href="#" class="chat-item">
                    <div class="chat-item-avatar">
                        <span class="avatar-ph"></span>
                        <span class="status-dot online"></span>
                    </div>
                    <div class="chat-item-body">
                        <div class="chat-item-top">
                            <span class="skeleton-text skeleton-name"></span>
                            <span class="skeleton-text skeleton-time"></span>
                        </div>
                        <div class="chat-item-bottom">
                            <span class="skeleton-text skeleton-preview"></span>
                        </div>
                    </div>
                </a>

                <a href="#" class="chat-item">
                    <div class="chat-item-avatar">
                        <span class="avatar-ph"></span>
                        <span class="status-dot away"></span>
                    </div>
                    <div class="chat-item-body">
                        <div class="chat-item-top">
                            <span class="skeleton-text skeleton-name"></span>
                            <span class="skeleton-text skeleton-time"></span>
                        </div>
                        <div class="chat-item-bottom">
                            <span class="skeleton-text skeleton-preview"></span>
                        </div>
                    </div>
                </a>

                <a href="#" class="chat-item">
                    <div class="chat-item-avatar">
                        <span class="avatar-ph"></span>
                        <span class="status-dot online"></span>
                    </div>
                    <div class="chat-item-body">
                        <div class="chat-item-top">
                            <span class="skeleton-text skeleton-name"></span>
                            <span class="skeleton-text skeleton-time"></span>
                        </div>
                        <div class="chat-item-bottom">
                            <span class="skeleton-text skeleton-preview"></span>
                        </div>
                    </div>
                </a>

                <a href="#" class="chat-item">
                    <div class="chat-item-avatar">
                        <span class="avatar-ph"></span>
                        <span class="status-dot online"></span>
                    </div>
                    <div class="chat-item-body">
                        <div class="chat-item-top">
                            <span class="skeleton-text skeleton-name"></span>
                            <span class="skeleton-text skeleton-time"></span>
                        </div>
                        <div class="chat-item-bottom">
                            <span class="skeleton-text skeleton-preview"></span>
                        </div>
                    </div>
                </a>

                <a href="#" class="chat-item">
                    <div class="chat-item-avatar chat-item-avatar-group">
                        <span class="avatar-ph"></span>
                        <span class="status-dot online"></span>
                    </div>
                    <div class="chat-item-body">
                        <div class="chat-item-top">
                            <span class="skeleton-text skeleton-name"></span>
                            <span class="skeleton-text skeleton-time"></span>
                        </div>
                        <div class="chat-item-bottom">
                            <span class="skeleton-text skeleton-preview"></span>
                        </div>
                    </div>
                </a>

                <a href="#" class="chat-item">
                    <div class="chat-item-avatar chat-item-avatar-group">
                        <span class="avatar-ph"></span>
                        <span class="status-dot online"></span>
                    </div>
                    <div class="chat-item-body">
                        <div class="chat-item-top">
                            <span class="skeleton-text skeleton-name"></span>
                            <span class="skeleton-text skeleton-time"></span>
                        </div>
                        <div class="chat-item-bottom">
                            <span class="skeleton-text skeleton-preview"></span>
                        </div>
                    </div>
                </a>

            </div>

            <a href="#" class="encrypted-banner">
                <span class="encrypted-icon"><i class="fa-solid fa-shield-halved"></i></span>
                <div>
                    <p class="encrypted-title">End-to-end Encrypted</p>
                    <p class="encrypted-sub">Your messages are safe</p>
                </div>
                <i class="fa-solid fa-chevron-right"></i>
            </a>

            <div class="sidebar-footer">
                <i class="fa-solid fa-sun"></i>
                <label class="mini-toggle">
                    <input type="checkbox">
                    <span class="mini-toggle-track"></span>
                </label>
                <i class="fa-solid fa-moon"></i>
                <div class="footer-spacer"></div>
                <button class="icon-btn-flat" aria-label="Help"><i class="fa-regular fa-circle-question"></i></button>
                <button class="icon-btn-flat" aria-label="Settings"><i class="fa-solid fa-gear"></i></button>
            </div>

        </aside>

        <!-- ============ CENTER: Conversation ============ -->
        <main class="chat-main">

            <header class="chat-main-header">
                <div class="chat-main-who">
                    <div class="chat-item-avatar">
                        <span class="avatar-ph"></span>
                        <span class="status-dot online"></span>
                    </div>
                    <div>
                        <p class="chat-main-name skeleton-text skeleton-name-lg"></p>
                        <p class="chat-main-status"><span class="status-text-dot"></span>Active Now</p>
                    </div>
                </div>

                <div class="chat-main-actions">
                    <button class="icon-btn-round" aria-label="Favourite"><i class="fa-regular fa-star"></i></button>
                    <button class="icon-btn-round" aria-label="Add to group"><i class="fa-solid fa-user-plus"></i></button>
                    <button class="icon-btn-round" aria-label="Video call"><i class="fa-solid fa-video"></i></button>
                    <button class="icon-btn-round" aria-label="Voice call"><i class="fa-solid fa-phone"></i></button>
                    <button class="icon-btn-round" aria-label="More"><i class="fa-solid fa-ellipsis"></i></button>
                </div>
            </header>

            <!-- TODO: bind message thread from GET /api/chats/:id/messages, paginate on scroll -->
            <div class="chat-messages">

                <div class="date-divider"><span>Today</span></div>

                <div class="msg-row mine">
                    <div class="msg-bubble mine">
                        <span class="skeleton-text skeleton-msg-sm" data-skel="light"></span>
                    </div>
                    <div class="chat-item-avatar msg-avatar">
                        <span class="avatar-ph"></span>
                        <span class="status-dot online"></span>
                    </div>
                </div>

                <div class="msg-row">
                    <div class="chat-item-avatar msg-avatar">
                        <span class="avatar-ph"></span>
                        <span class="status-dot online"></span>
                    </div>
                    <div class="msg-bubble">
                        <div class="msg-meta">
                            <span class="skeleton-text skeleton-name"></span>
                            <span class="skeleton-text skeleton-time"></span>
                        </div>
                        <span class="skeleton-text skeleton-msg-sm"></span>
                    </div>
                </div>

                <div class="msg-row">
                    <div class="chat-item-avatar msg-avatar">
                        <span class="avatar-ph"></span>
                        <span class="status-dot online"></span>
                    </div>
                    <div class="msg-bubble gradient">
                        <div class="msg-meta on-gradient">
                            <span class="skeleton-text skeleton-name" data-skel="light"></span>
                            <span class="skeleton-text skeleton-time" data-skel="light"></span>
                        </div>
                        <span class="skeleton-text skeleton-msg-lg" data-skel="light"></span>
                    </div>
                </div>

                <div class="msg-row mine">
                    <div class="msg-bubble mine">
                        <div class="msg-meta on-dark">
                            <span class="skeleton-text skeleton-time" data-skel="dim"></span>
                        </div>
                        <span class="skeleton-text skeleton-msg-md" data-skel="light"></span>
                    </div>
                    <div class="chat-item-avatar msg-avatar">
                        <span class="avatar-ph"></span>
                        <span class="status-dot online"></span>
                    </div>
                </div>

                <div class="msg-row mine">
                    <div class="msg-bubble mine">
                        <div class="msg-meta on-dark">
                            <span class="skeleton-text skeleton-time" data-skel="dim"></span>
                        </div>
                        <span class="skeleton-text skeleton-msg-md" data-skel="light"></span>
                    </div>
                    <div class="chat-item-avatar msg-avatar">
                        <span class="avatar-ph"></span>
                        <span class="status-dot online"></span>
                    </div>
                </div>

                <!-- Live typing indicator — TODO: show/hide via typing_start / typing_stop socket events -->
                <div class="msg-row typing-row">
                    <div class="chat-item-avatar msg-avatar">
                        <span class="avatar-ph"></span>
                        <span class="status-dot online"></span>
                    </div>
                    <div class="typing-dots">
                        <span></span><span></span><span></span>
                    </div>
                </div>

            </div>

            <div class="chat-input-row">
                <button class="icon-btn-flat" aria-label="Emoji"><i class="fa-regular fa-face-smile"></i></button>
                <input type="text" placeholder="Type a message…" class="chat-input">
                <button class="icon-btn-flat" aria-label="Attach file"><i class="fa-solid fa-paperclip"></i></button>
                <button class="icon-btn-flat" aria-label="Voice note"><i class="fa-solid fa-microphone"></i></button>
                <button class="send-btn" aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button>
            </div>

            <div class="chat-quick-actions">
                <button class="quick-action ai"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Suggest</button>
                <button class="quick-action secure"><i class="fa-solid fa-lock"></i> Secure File</button>
                <button class="quick-action report"><i class="fa-solid fa-triangle-exclamation"></i> Report</button>
            </div>

        </main>

        <!-- ============ RIGHT: Profile / media / AI safety ============ -->
        <aside class="chat-profile">

            <div class="profile-head">
                <!-- TODO: bind from GET /api/chats/:id/participant -->
                <div class="profile-avatar">
                    <span class="avatar-ph"></span>
                    <span class="status-dot online"></span>
                </div>
                <p class="profile-name skeleton-text skeleton-name-lg" style="margin: 0 auto;"></p>
                <p class="profile-status"><span class="status-text-dot"></span>Active Now</p>
            </div>

            <div class="profile-actions">
                <button class="profile-action">
                    <span class="profile-action-icon"><i class="fa-solid fa-user"></i></span>
                    Profile
                </button>
                <button class="profile-action">
                    <span class="profile-action-icon"><i class="fa-solid fa-bell-slash"></i></span>
                    Mute
                </button>
                <button class="profile-action">
                    <span class="profile-action-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
                    Search
                </button>
                <button class="profile-action">
                    <span class="profile-action-icon"><i class="fa-solid fa-ellipsis"></i></span>
                    More
                </button>
            </div>

            <div class="profile-section">
                <div class="profile-section-head">
                    <h4>Media</h4>
                    <a href="#">View all</a>
                </div>
                <!-- TODO: bind from GET /api/chats/:id/media?type=image&limit=6 -->
                <div class="media-grid">
                    <span class="media-thumb"></span>
                    <span class="media-thumb"></span>
                    <span class="media-thumb"></span>
                    <span class="media-thumb"></span>
                    <span class="media-thumb"></span>
                    <span class="media-thumb"></span>
                </div>
            </div>

            <div class="profile-section">
                <div class="profile-section-head">
                    <h4>Files</h4>
                    <a href="#">View all</a>
                </div>
                <!-- TODO: bind from GET /api/chats/:id/files?limit=3 -->
                <div class="file-row">
                    <span class="file-icon pdf"><i class="fa-solid fa-file-pdf"></i></span>
                    <div class="file-meta">
                        <p class="skeleton-text skeleton-name"></p>
                        <p class="skeleton-text skeleton-time"></p>
                    </div>
                    <button class="icon-btn-flat" aria-label="Download"><i class="fa-solid fa-download"></i></button>
                </div>
                <div class="file-row">
                    <span class="file-icon doc"><i class="fa-solid fa-file-word"></i></span>
                    <div class="file-meta">
                        <p class="skeleton-text skeleton-name"></p>
                        <p class="skeleton-text skeleton-time"></p>
                    </div>
                    <button class="icon-btn-flat" aria-label="Download"><i class="fa-solid fa-download"></i></button>
                </div>
                <div class="file-row">
                    <span class="file-icon sheet"><i class="fa-solid fa-file-excel"></i></span>
                    <div class="file-meta">
                        <p class="skeleton-text skeleton-name"></p>
                        <p class="skeleton-text skeleton-time"></p>
                    </div>
                    <button class="icon-btn-flat" aria-label="Download"><i class="fa-solid fa-download"></i></button>
                </div>
            </div>

            <!-- TODO: bind from GET /api/chats/:id/ai-safety -->
            <div class="ai-safety-card">
                <p class="ai-safety-title"><i class="fa-solid fa-shield-halved"></i> AI Safety</p>
                <p class="ai-safety-sub">Checking this conversation…</p>

                <div class="safety-ring">
                    <svg viewBox="0 0 36 36">
                        <path class="ring-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                        <path class="ring-fill-pending" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    </svg>
                    <span class="ring-value skeleton-text skeleton-pct"></span>
                </div>
                <p class="safety-label">Safety score</p>

                <p class="last-scanned"><i class="fa-solid fa-circle-check"></i> Last scanned <span class="skeleton-text skeleton-time"></span></p>
            </div>

        </aside>

    </div>

</body>
</html>
